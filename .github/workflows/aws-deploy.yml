name: Deploy SimpleLendingBot to AWS

on:
  push:
    branches: [ simple ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: simple-lending-bot
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Building image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        docker build -f Dockerfile.aws --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
        # Also tag as latest
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Update ECS service
      run: |
        aws ecs update-service \
          --cluster simple-lending-bot-cluster \
          --service simple-lending-bot-service \
          --force-new-deployment \
          --region us-west-2

    - name: Wait for deployment to complete
      run: |
        aws ecs wait services-stable \
          --cluster simple-lending-bot-cluster \
          --services simple-lending-bot-service \
          --region us-west-2

    - name: Get deployment status
      run: |
        aws ecs describe-services \
          --cluster simple-lending-bot-cluster \
          --services simple-lending-bot-service \
          --query "services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount}" \
          --output table